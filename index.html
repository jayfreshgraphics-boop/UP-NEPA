<!DOCTYPE html>
<html>
<head>
  <title>Up NEPA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 0; }
    #status-card {
      margin-top: 80px;
      padding: 40px 20px;
      color: white;
      transition: background-color 0.3s;
    }
    #status-card.on { background-color: #1EB980; }
    #status-card.off { background-color: #E0453D; }
    h1 { font-size: 32px; margin: 10px 0; }
    p { font-size: 16px; opacity: 0.9; }
  </style>
</head>
<body>
  <div id="status-card">
    <h1 id="status-title">Loading...</h1>
    <p id="status-sub"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB2U30HAjfG120_VJ2MWg_Op41szIhRVLk",
      authDomain: "up-nepa-56ab0.firebaseapp.com",
      projectId: "up-nepa-56ab0",
      storageBucket: "up-nepa-56ab0.firebasestorage.app",
      messagingSenderId: "107171702742",
      appId: "1:107171702742:web:d47d1bf85ed4af1dece677"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection("devices").doc("demo-device")
      .onSnapshot((doc) => {
        const data = doc.data();
        const card = document.getElementById("status-card");
        const title = document.getElementById("status-title");
        const sub = document.getElementById("status-sub");

        if (data.isPowerOn) {
          card.className = "on";
          title.textContent = "⚡ Up NEPA!";
          sub.textContent = data.label + " — Power is ON";
        } else {
          card.className = "off";
          title.textContent = "🔌 NEPA Don Go";
          sub.textContent = data.label + " — Power is OFF";
        }
      });
  </script>
</body>
</html>
