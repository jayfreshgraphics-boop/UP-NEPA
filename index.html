<!DOCTYPE html>
<html>
<head>
  <title>Up NEPA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 0; color: black; }
    #status-card {
      margin-top: 40px;
      padding: 40px 20px;
      transition: background-color 0.3s;
    }
    #status-card.on { background-color: #1EB980; color: white; }
    #status-card.off { background-color: #E0453D; color: white; }
    h1 { font-size: 32px; margin: 10px 0; }
    p { font-size: 16px; opacity: 0.9; }

    #history {
      max-width: 500px;
      margin: 30px auto;
      padding: 0 20px;
      text-align: left;
    }
    #history h2 { font-size: 18px; color: #333; }
    .outage-item {
      background: #f2f2f2;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .outage-item .duration { font-weight: bold; float: right; }
    .outage-item .time { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <div id="status-card">
    <h1 id="status-title">Loading...</h1>
    <p id="status-sub"></p>
  </div>

  <div id="history">
    <h2>Recent outages</h2>
    <div id="history-list">Loading history...</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB2U30HAjfG120_VJ2MWg_Op41szIhRVLk",
      authDomain: "up-nepa-56ab0.firebaseapp.com",
      projectId: "up-nepa-56ab0",
      storageBucket: "up-nepa-56ab0.firebasestorage.app",
      messagingSenderId: "107171702742",
      appId: "1:107171702742:web:d47d1bf85ed4af1dece677"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection("devices").doc("demo-device")
      .onSnapshot((doc) => {
        const data = doc.data();
        const card = document.getElementById("status-card");
        const title = document.getElementById("status-title");
        const sub = document.getElementById("status-sub");
        if (!data) return;
        if (data.isPowerOn) {
          card.className = "on";
          title.textContent = "Up NEPA!";
          sub.textContent = data.label + " - Power is ON";
        } else {
          card.className = "off";
          title.textContent = "NEPA Don Go";
          sub.textContent = data.label + " - Power is OFF";
        }
      });

    function formatDuration(startStr, endStr) {
      const start = new Date(startStr);
      const end = new Date(endStr);
      const mins = Math.round((end - start) / 60000);
      if (mins < 60) return mins + "m";
      return Math.floor(mins / 60) + "h " + (mins % 60) + "m";
    }

    function formatTime(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleString();
    }

    db.collection("devices").doc("demo-device").collection("outages")
      .orderBy("startTime", "desc")
      .onSnapshot((snapshot) => {
        const list = document.getElementById("history-list");
        if (snapshot.empty) {
          list.innerHTML = "No outages recorded yet.";
          return;
        }
        list.innerHTML = "";
        snapshot.forEach((doc) => {
          const o = doc.data();
          const div = document.createElement("div");
          div.className = "outage-item";
          div.innerHTML =
            '<span class="duration">' + formatDuration(o.startTime, o.endTime) + '</span>' +
            '<div class="time">' + formatTime(o.startTime) + '</div>';
          list.appendChild(div);
        });
      });
  </script>
</body>
</html>
